name: Live site snapshot (Webflow to Vercel migration)
on:
  push:
    branches:
      - migration/live-snapshot
    paths:
      - 'scripts/migration/**'
      - '.github/workflows/migration-snapshot.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: migration-snapshot
  cancel-in-progress: false
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Crawl the live site
        run: python3 scripts/migration/crawl_live.py migration-snapshot
      - name: Commit the snapshot
        run: |
          git config user.name "migration-snapshot"
          git config user.email "migration-snapshot@users.noreply.github.com"
          git add migration-snapshot
          git commit -m "Live site snapshot $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]" || echo "No changes"
          git push
